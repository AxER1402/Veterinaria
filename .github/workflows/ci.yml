# CI: en cada push y pull request se compila el frontend, se revisa el PHP, se buscan claves
# filtradas y se levanta el stack completo para correr las pruebas de seguridad y el simulacro DRP.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, auditoría npm)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # A06 (componentes vulnerables): falla con vulnerabilidades altas o críticas en dependencias de producción.
      - run: npm audit --omit=dev --audit-level=high

  php:
    name: PHP (sintaxis) y secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxis PHP 8.3
        run: docker run --rm -v "$PWD/services:/s:ro" php:8.3-cli sh -c 'find /s -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null'
      - name: Ninguna clave en el repositorio
        run: |
          if git grep -nE 'sk_(test|live)_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{10,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----' -- . ':!tests'; then
            echo "::error::Hay claves o llaves privadas en archivos versionados"; exit 1
          fi
          test ! -e .env

  sast:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-24.04
    # CodeQL no analiza PHP y en repos privados requiere Advanced Security: Semgrep CE cubre PHP, JS y secretos.
    container: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v5
      # Falla con cualquier hallazgo; los falsos positivos se justifican en línea con `nosemgrep: <regla> (motivo)`.
      - run: semgrep scan --config p/php --config p/javascript --config p/secrets --metrics=off --error

  seguridad:
    name: Stack completo + pruebas de seguridad + simulacro DRP
    needs: [frontend, php, sast]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: .env con secretos efímeros
        run: ops/generar-env.sh
      - name: Levantar el stack
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Pruebas de seguridad (tests/seguridad.sh)
        shell: bash   # bash -eo pipefail: si las pruebas fallan, tee no lo tapa
        run: tests/seguridad.sh 2>&1 | tee "$RUNNER_TEMP/seguridad.log"
      - name: Resumen de las pruebas en la página del CI
        if: always()
        run: |
          {
            echo '### Pruebas de seguridad (tests/seguridad.sh)'
            echo '```'
            grep -E '✘|^Resultado' "$RUNNER_TEMP/seguridad.log" || echo 'Las pruebas no llegaron a correr.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Simulacro DRP (ransomware en el maestro)
        run: ops/simulacro-drp.sh --si
      - name: Evidencia
        if: always()
        run: ops/evidencia.sh || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidencia-${{ github.sha }}
          path: |
            docs/simulacros/
            docs/evidencia/README.md
          retention-days: 30
      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --tail 150
