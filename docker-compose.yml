services:
  web:
    build: .
    image: huellitas-veterinaria:latest
    container_name: huellitas-web
    ports:
      - "8080:80"
    restart: unless-stopped

  # Entorno de desarrollo con recarga en caliente: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
