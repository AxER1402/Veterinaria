# Huellitas — E-Commerce distribuido (microservicios).
#   cp .env.example .env   # y rellenar los secretos
#   docker compose up -d --build
#
# Hardening (FASE 11): solo el gateway publica puertos; BD y Redis viven en una red interna
# sin salida a Internet y sin "ports:"; los servicios PHP corren como www-data, sin
# capabilities, con sistema de archivos de solo lectura y límites de memoria/CPU.

name: huellitas

x-php: &php
  restart: unless-stopped
  networks: [interna]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp
    - /var/run/apache2:uid=33,gid=33,mode=0755
    - /var/lock/apache2:uid=33,gid=33,mode=0755
  mem_limit: 256m
  cpu_shares: 512

x-php-env: &php-env
  TZ: America/Guatemala
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
  SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?falta SERVICE_JWT_SECRET}
  AUDIT_URL: http://security-audit-service:8086

services:
  # ---------- Entrada única ----------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        VITE_GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_EMBED_KEY:-}
    image: huellitas/gateway:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-127.0.0.1/32}
    volumes:
      - ./gateway/certs:/etc/nginx/certs
    networks: [publica, interna]
    depends_on:
      auth-service: { condition: service_healthy }
      catalogo-service: { condition: service_healthy }
      pedidos-service: { condition: service_healthy }
      pagos-service: { condition: service_healthy }
      citas-service: { condition: service_healthy }
      security-audit-service: { condition: service_healthy }
    mem_limit: 128m
    cpu_shares: 1024

  # ---------- Microservicios ----------
  auth-service:
    <<: *php
    build: { context: ./services, args: { SERVICE: auth, PORT: 8081 } }
    image: huellitas/auth-service:latest
    environment:
      <<: *php-env
      SERVICE_NAME: auth-service
      DB_HOST: mariadb-master
      DB_READ_HOST: mariadb-slave
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?falta AUTH_DB_PASSWORD}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?falta MFA_ENCRYPTION_KEY}
    depends_on:
      mariadb-master: { condition: service_healthy }
      redis: { condition: service_healthy }
      security-audit-service: { condition: service_healthy }

  catalogo-service:
    <<: *php
    build: { context: ./services, args: { SERVICE: catalogo, PORT: 8082 } }
    image: huellitas/catalogo-service:latest
    environment:
      <<: *php-env
      SERVICE_NAME: catalogo-service
      DB_HOST: mariadb-master
      DB_READ_HOST: mariadb-slave
      DB_NAME: catalogo_db
      DB_USER: catalogo_user
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD:?falta CATALOGO_DB_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mariadb-master: { condition: service_healthy }
      redis: { condition: service_healthy }
      security-audit-service: { condition: service_healthy }

  pedidos-service:
    <<: *php
    build: { context: ./services, args: { SERVICE: pedidos, PORT: 8083 } }
    image: huellitas/pedidos-service:latest
    environment:
      <<: *php-env
      SERVICE_NAME: pedidos-service
      DB_HOST: mariadb-master
      DB_READ_HOST: mariadb-slave
      DB_NAME: pedidos_db
      DB_USER: pedidos_user
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?falta PEDIDOS_DB_PASSWORD}
      CATALOGO_URL: http://catalogo-service:8082
      PAGOS_URL: http://pagos-service:8084
      NOTIFICACIONES_URL: http://notificaciones-service:8085
    depends_on:
      mariadb-master: { condition: service_healthy }
      redis: { condition: service_healthy }
      catalogo-service: { condition: service_healthy }
      security-audit-service: { condition: service_healthy }

  # Tarea periódica: cancela los pedidos que siguen sin pagar tras PEDIDO_VENCE_HORAS y devuelve el stock.
  pedidos-vencimientos:
    <<: *php
    # Misma imagen que pedidos-service. Necesita su propio build: en una máquina limpia (CI) la
    # imagen no existe en ningún registro y Compose intentaría descargarla.
    build: { context: ./services, args: { SERVICE: pedidos, PORT: 8083 } }
    image: huellitas/pedidos-service:latest
    # Cada ejecución correcta anota la hora; el contenedor está sano si la última fue hace menos de 2 ciclos.
    command: ["sh", "-c", "while :; do php /var/www/app/bin/vencer.php && date +%s > /tmp/vencimiento-ok; sleep ${PEDIDO_VENCIMIENTO_CADA_SEG:-900}; done"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/vencimiento-ok && [ $$(( $$(date +%s) - $$(cat /tmp/vencimiento-ok) )) -lt $$(( 2 * ${PEDIDO_VENCIMIENTO_CADA_SEG:-900} + 60 )) ]"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    mem_limit: 96m
    cpu_shares: 256
    environment:
      <<: *php-env
      SERVICE_NAME: pedidos-service
      DB_HOST: mariadb-master
      DB_NAME: pedidos_db
      DB_USER: pedidos_user
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      CATALOGO_URL: http://catalogo-service:8082
      PEDIDO_VENCE_HORAS: ${PEDIDO_VENCE_HORAS:-24}
    depends_on:
      pedidos-service: { condition: service_healthy }

  # Mascotas y citas de la clínica, guardería y paseos (FASE 15).
  citas-service:
    <<: *php
    build: { context: ./services, args: { SERVICE: citas, PORT: 8087 } }
    image: huellitas/citas-service:latest
    environment:
      <<: *php-env
      SERVICE_NAME: citas-service
      DB_HOST: mariadb-master
      DB_READ_HOST: mariadb-slave
      DB_NAME: citas_db
      DB_USER: citas_user
      DB_PASSWORD: ${CITAS_DB_PASSWORD:?falta CITAS_DB_PASSWORD}
      CITAS_CUPOS: ${CITAS_CUPOS:-2}
    depends_on:
      mariadb-master: { condition: service_healthy }
      redis: { condition: service_healthy }
      security-audit-service: { condition: service_healthy }

  # Pagos y notificaciones son los únicos con salida a Internet (Stripe, PayPal, EmailJS).
  pagos-service:
    <<: *php
    networks: [interna, salida]
    build: { context: ./services, args: { SERVICE: pagos, PORT: 8084 } }
    image: huellitas/pagos-service:latest
    environment:
      <<: *php-env
      SERVICE_NAME: pagos-service
      DB_HOST: mariadb-master
      DB_NAME: pagos_db
      DB_USER: pagos_user
      DB_PASSWORD: ${PAGOS_DB_PASSWORD:?falta PAGOS_DB_PASSWORD}
      PEDIDOS_URL: http://pedidos-service:8083
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?falta STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
    depends_on:
      mariadb-master: { condition: service_healthy }
      redis: { condition: service_healthy }
      security-audit-service: { condition: service_healthy }

  notificaciones-service:
    <<: *php
    networks: [interna, salida]
    build: { context: ./services, args: { SERVICE: notificaciones, PORT: 8085 } }
    image: huellitas/notificaciones-service:latest
    environment:
      <<: *php-env
      SERVICE_NAME: notificaciones-service
      COMPROBANTE_SECRET: ${COMPROBANTE_SECRET:?falta COMPROBANTE_SECRET}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    depends_on:
      redis: { condition: service_healthy }
      security-audit-service: { condition: service_healthy }

  security-audit-service:
    <<: *php
    build: { context: ./services, args: { SERVICE: audit, PORT: 8086 } }
    image: huellitas/security-audit-service:latest
    environment:
      <<: *php-env
      SERVICE_NAME: security-audit-service
      DB_HOST: mariadb-audit
      DB_NAME: audit_db
      DB_USER: audit_user
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:?falta AUDIT_DB_PASSWORD}
    depends_on:
      mariadb-audit: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ---------- Datos (sin puertos publicados) ----------
  mariadb-master:
    image: mariadb:10.6
    restart: unless-stopped
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--expire-logs-days=7"]
    environment:
      TZ: America/Guatemala
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
      MARIADB_REPLICATION_USER: replicador
      MARIADB_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:?falta DB_REPLICATION_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD:?falta CATALOGO_DB_PASSWORD}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD:?falta PEDIDOS_DB_PASSWORD}
      PAGOS_DB_PASSWORD: ${PAGOS_DB_PASSWORD:?falta PAGOS_DB_PASSWORD}
      CITAS_DB_PASSWORD: ${CITAS_DB_PASSWORD:?falta CITAS_DB_PASSWORD}
    volumes:
      - master_data:/var/lib/mysql
      - ./db/master:/docker-entrypoint-initdb.d:ro
    networks: [interna]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpu_shares: 1024

  # Réplica de solo lectura: catálogo y reportes leen de aquí (DB_READ_HOST).
  mariadb-slave:
    image: mariadb:10.6
    restart: unless-stopped
    command: ["--server-id=2", "--read-only=1", "--relay-log=relay-bin", "--log-bin=mysql-bin", "--log-slave-updates=1"]
    environment:
      TZ: America/Guatemala
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_MASTER_HOST: mariadb-master
      MARIADB_HEALTHCHECK_GRANTS: REPLICA MONITOR   # el healthcheck consulta el estado de la replicación
      MARIADB_REPLICATION_USER: replicador
      MARIADB_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD}
    volumes:
      - slave_data:/var/lib/mysql
    networks: [interna]
    depends_on:
      mariadb-master: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--replication_io", "--replication_sql", "--replication"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpu_shares: 512

  # BD de auditoría: instancia y volumen separados de las BD de negocio.
  mariadb-audit:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      TZ: America/Guatemala
      MARIADB_ROOT_PASSWORD: ${AUDIT_DB_ROOT_PASSWORD:?falta AUDIT_DB_ROOT_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
    volumes:
      - audit_data:/var/lib/mysql
      - ./db/audit:/docker-entrypoint-initdb.d:ro
    networks: [interna]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    cpu_shares: 512

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: la lista negra de JWT sobrevive a un reinicio (RPO 0). Comandos destructivos deshabilitados.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      --maxmemory 128mb --maxmemory-policy volatile-lru
      --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command CONFIG "" --rename-command DEBUG ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    cpu_shares: 512

  # Desarrollo del frontend con recarga en caliente: docker compose --profile dev up frontend-dev
  frontend-dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      API_PROXY: https://gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [publica]

networks:
  publica:
  interna:
    internal: true   # sin salida a Internet ni acceso desde fuera
  salida:            # solo para pagos y notificaciones (APIs externas)

volumes:
  master_data:
  slave_data:
  audit_data:
  redis_data:
